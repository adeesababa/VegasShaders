[_Shaders.Flashlight.Main]
Dimmer = 4.0                           # [0-50] How bright the flashlight is at the centre of its beam, in the lamps' units (1 is about a bright lamp up close). Its colour is your Pip-Boy's HUD colour (the game's display settings).
Distance = 1000                        # How far the beam reaches, in game units (it fades out well before this: see Deferred's Falloff).
AttachToWeapon = true                  # The flashlight rides the weapon instead of the camera (in third person: the head). It rides the weapon while aiming either way.

[_Shaders.Flashlight.Deferred]
Shadows = true                         # Everything in front of the flashlight casts a shadow in its beam (a shadow map drawn from the light every frame while it is on).
ShadowSoftness = 5.0                   # [0-16] How soft the shadow edges are: the PCF blur's radius in texels of a 512 map (the same width whatever ShadowMapSize is). 16 bilinear PCF samples.
ShadowBias = 0.004                     # [0-0.1] How far a surface may be behind its shadow map depth and still count as lit, as a share of the beam's reach. Raise it if surfaces shadow themselves in stripes; lower it if shadows lift off their casters.
ShadowMapSize = 2048                   # NEEDS A RESTART. [512, 1024, 2048, 4096] The flashlight's own shadow map resolution (it used the lamp shadows' ShadowCubeMapSize before). Higher: sharper shadow shapes, more video memory (2048: 16 MB).
Cookie = 0.0                           # [0-1] The flashlight lens pattern (Effects\Flashlight.png) over the beam. 0 a clean beam.
Falloff = 4.0                          # [0-32] How fast the beam fades with distance: a windowed inverse square, bright close up, about a quarter as bright halfway to the reach (Distance) at 4, nothing at the reach. Higher: a shorter beam. 0: the lamps' falloff (still three quarters as bright halfway out).
GameLight = true                       # The flashlight is also a real game light (the Pip-Boy light, moved onto the beam), so everything a lamp lights reacts to it as to a lamp at night: leaves, your first-person view, see-through things and the env-map shine of glossy assets. What the light pass already lights gets none of it (no double light); the rest gets it as far as the object is in the beam.
DebugView = 0                          # DIAGNOSTIC: 1 the flashlight's light alone, 2 its shadow, 3 the normals it lights by. 0 off.
TestForceOn = false                    # TEST, for automatic tests: the flashlight on as if the Pip-Boy light were (and the game's Pip-Boy light switched on). Leave off.

[_Shaders.Flashlight.Status]
Enabled = true                         # The flashlight (the Pip-Boy light's key): a real spot light, coloured by your Pip-Boy's HUD colour, that lights the world's surfaces with their own colour, roughness and metal, casts shadows, lights the grass, and is the game's lamp for what that light cannot reach. Needs [Main.Main.Quality] CapturedNormals, MaterialBuffer and AlbedoBuffer (restart) for the surfaces.

