[_Shaders.WetWorld.Main]
FastPaths = true                    # UNOFFICIAL (2026-10-17): the same rain picture for about 1 ms less GPU time (2560x1440): the wet pass's early exits (sky, distance, water, dry or roofed ground, your weapon), its puddle colour and its lamp loop really skip work (the shader compiler had turned them into work every pixel did). Measured: within the frame-to-frame rain flicker; the only place it can differ is the puddle reflection's rare screen-edge cases. Off = the original pass. Applies immediately
FixedReflectionTrace = false        # UNOFFICIAL (2026-10-17): fixes the puddle reflection (the screen-space trace of WetWorld). Its loop exits never worked on the GPU, so it kept the last hit it found at full strength, ran past the screen border and flipped under any recompile. Fixed: the first hit counts, rays that pass behind a thin object are no hit, and the reflection fades out towards the screen borders and with distance. Looks slightly different (softer, no border patches), so it is off by default. Costs about 0.1-0.2 ms in rain. Applies immediately
KeepHighlights = true               # UNOFFICIAL (2026-10-16): in rain the wet pass no longer cuts the picture at full white before the tonemapper (sun, bright sky and wet highlights keep their soft roll-off). Off = the old clamp. Applies immediately
Amount = 0.0                        # Darkness of puddles
Decrease = 0.0                      # Time it takes in game hours for puddles to dissipate
Increase = 0.0                      # Time it takes in game hours for puddles to appear
PuddleCoeff_B = 0.48                # Not used.
PuddleCoeff_G = 0.62                # Not used.
PuddleCoeff_R = 0.72                # Not used.
PuddleSpecularMultiplier = 0.2      # Not used.
Persistent = false                  # UNOFFICIAL (2026-10-27): wet ground and puddles are kept spot by spot in a map round you, instead of one amount for the whole world. The rain wets only what it reaches (ground under a roof stays dry), and after the rain each spot dries on its own: sunlit ground first, shaded ground and everything at night more slowly, so the street you left wet is still wet when you look back. Off = as before (puddles and wet ground vanish as the rain stops). Costs about 0.05 ms a frame on average for the map, and the wet pass keeps running until the last wet spot has dried. Uses 32 MB of video memory. Applies immediately (the map starts from the current rain).
PersistentWetTime = 0.25            # [0-24] (Persistent) Game hours of rain for open ground to get fully wet. 0: at once.
PersistentDryTime = 1.5             # [0-48] (Persistent) Game hours for wet ground in full sun to dry after the rain. Shade and night take longer (PersistentShade).
PersistentPuddleFill = 0.5          # [0-24] (Persistent) Game hours of rain for the puddles to fill. 0: at once.
PersistentPuddleDry = 4.0           # [0-96] (Persistent) Game hours for puddles in full sun to dry up after the rain.
PersistentShade = 0.35              # [0.02-1] (Persistent) How fast shaded spots dry compared with sunlit ones (also everything at night): 0.35 = about three times slower; 1 = no difference. Shade is found from the heights of roofs, walls and trees round each spot, towards the sun.
PersistentMapSize = 8192            # [1024-65536] (Persistent wetness and snow) Width of the map round you in game units (8192 = about 117 m). Beyond it the single amount for open ground applies. Shared with SnowAccumulation's Persistent. Applies immediately (the map starts again).
PersistentMapResolution = 1024      # [128-4096] (Persistent wetness and snow) Texels across the map: 1024 at 8192 units = 8 units (about 11 cm) a texel, 32 MB of video memory (4x for 2048). Applies immediately (the map starts again).
PuddlesLandOnly = 1                 # [0-2] UNOFFICIAL (2026-11-12), with [Main.Main.Quality] MaterialBuffer: where puddles and the wet look may go is decided by what each surface is, not only by "faces up and lies in a hollow". 1 (ground-like): the land, and rigid objects such as roads, pavements, floors, rocks and cars keep everything; people and creatures get no puddles, ripples, splashes or streaks; cloth and plants keep the wet shine but hold no puddle. 2 (land only): puddles and puddle reflections on the land alone; roads and every other object keep only the wet shine (roads are objects in this game, so they lose their puddles). 0: the old guess everywhere. Without the material buffer (it is off, or native D3D9 with the game's anti-aliasing) the old guess stays. Applies immediately.
PuddlesMinObjectSize = 0.0          # [0-4096] UNOFFICIAL (2026-11-12), with PuddlesLandOnly 1: rigid objects smaller than this (the radius of the drawn piece, in game units) hold no puddle; they keep the wet shine. 0: no size test. Try 150 to keep puddles off crates, barrels and furniture; road pieces are far larger. Applies immediately.
WeaponRainHandOff = false           # UNOFFICIAL (2026-11-12): while the HUD raindrops ([Shaders.WetnessEffects.HudRaindrops]) are on, this effect leaves your arms and weapon alone. Without it the weapon gets two rain layers: the drops drawn on it, and this effect's ripples and splashes over the same pixels. Off = as before. Applies immediately.
ReflectionsOwnPuddles = false       # UNOFFICIAL (2026-11-12): while it rains and the Reflections effect is on with RainWetness above 0, the puddles leave their mirror image to it (no sky and cloud image of their own, no puddle reflection trace; sun and lamp glints stay). Without it the puddles show two reflections on top of each other. Off = as before. Applies immediately.
RainStateGuard = true               # UNOFFICIAL (2026-11-12), applies immediately: one rain state for everything that reads "it rains" or "the ground is wet" (this effect, the Rain setting groups of the land and the objects, skin, heat haze, water ripples, the Reflections effect's wetness, Specular's rain look). It follows the weather every frame, whether this effect or Precipitations is switched on or off, so it can no longer stay stuck at "wet": not after an effect is switched off in the rain, not after the rain stops with Increase / Decrease at 0 (the puddle amount then stayed at full for the rest of the session), and not after loading an older save during a fade. Off = as before: each effect animates its own amount, only while it is on.
PersistentDebugView = 0             # (Persistent wetness and snow) Test view. 1: the map drawn top-down in the top-left corner, north up, you at the red dot: grey = dry ground, blue = wet, cyan = puddle water, white = snow, brown = trodden snow, darker = in shade, dark lines = the height of the top surfaces it has seen (a line every 256 units), diagonal hatching = no height seen there yet (the spot follows the open-ground amounts), yellow = the map's edge, purple = the map holds nothing yet. 2: the map's wetness and snow painted over the world (red tint where the single amount applies). 0: off.

[_Shaders.WetWorld.Status]
Enabled = true                      # Water ripples on surfaces, and puddles based on physical terrain pockets during rainy weathers. 
